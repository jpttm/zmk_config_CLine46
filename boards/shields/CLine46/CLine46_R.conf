#Mouse config ---------------------
# CONFIG_PMW3610_ALT_INVERT_X=y
# CONFIG_PMW3610_ALT_INVERT_Y=y
# CONFIG_PMW3610_ALT_SWAP_XY=y
# CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=10
# CONFIG_PMW3610_ALT_LOG_LEVEL_DBG=y
# CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=300 // <--see Troubleshooting

CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_PMW3610_ALT_SMART_ALGORITHM=y

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

##for NiMH battery
CONFIG_ZMK_NON_LIPO_BATTERY_MANAGEMENT=y

# optional
CONFIG_ZMK_NON_LIPO_MAX_MV=1360
CONFIG_ZMK_NON_LIPO_MIN_MV=1020
CONFIG_ZMK_NON_LIPO_LOW_MV=1000 
#CONFIG_ZMK_NON_LIPO_ADV_SLEEP_TIMEOUT=60000
# 60 seconds


#Layer LED config -------------------
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=n


#Bluetooth config -------------------
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12


# ========================================
# ZMK Studio（必須ベース）
# ========================================
CONFIG_ZMK_STUDIO=y

# Studio が接続されている間だけ、BLE の待ち時間を詰める要求を出す。
# 既定は 10 で、接続間隔 15ms との組み合わせだと 1往復あたり 15ms x (10+1) = 165ms
# かかる。0 にすると毎接続間隔で応答できるようになり、ビヘイビア一覧の取得のように
# 往復回数が多い処理が目に見えて速くなる。
# 効くのは Studio 接続中だけなので、普段の電池持ちには影響しない。
# 3110 さんの CLine46 fork の知見。
CONFIG_ZMK_STUDIO_TRANSPORT_BLE_PREF_LATENCY=0
# CONFIG_ZMK_STUDIO_LOCKING=n
# 注意: CONFIG_ZMK_STUDIO_LOCKING=n を設定しないでください。
# Studio Locking は BLE 接続に必要なため、デフォルトの y を維持する必要があります。
# 詳細は「BLE 接続」セクションを参照。

# BLE 接続スロット（プロファイル + Peripheral + Studio）
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6


# ========================================
# dya studioの各種機能
# ========================================
# Enable half-duplex UART mode provided
CONFIG_ZMK_SPLIT_WIRED_UART_MODE_INTERRUPT=y
# Enable split relay to unlock interacting with peripheral
CONFIG_ZMK_SPLIT_RELAY_EVENT=y

# For zephyr4.1 CONSOLE is enabled by default but not required
CONFIG_CONSOLE=n

#
# ZMK modules ready for custom RPC protocol
#

# https://github.com/cormoran/zmk-module-runtime-input-processor
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y
# https://github.com/cormoran/zmk-module-ble-management
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y
# https://github.com/cormoran/zmk-module-settings-rpc
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y
# https://github.com/cormoran/zmk-feature-input-stream
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y
# https://github.com/cormoran/zmk-feature-module-physical-layout
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE=y
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE_STUDIO_RPC=y
# https://github.com/cormoran/zmk-feature-custom-settings
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
# https://github.com/cormoran/zmk-feature-runtime-combo
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
# https://github.com/cormoran/zmk-feature-runtime-macro
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
# マウスジェスチャー用に16スロット全てを使用する(上限は16)。
# スロット0〜15はCLine46_R.overlayのruntime_macro_defaultsで
# G6-Up〜G9-Rightに固定割り当てされる。
CONFIG_ZMK_RUNTIME_MACRO_COUNT=16
# 16個分の名前+本体を格納するため既定の1024Bから拡張
CONFIG_ZMK_RUNTIME_MACRO_POOL_BYTES=2048

# 6 gesture groups x 4 directions
CONFIG_ZMK_GESTURE_ACTION_COUNT=24
# https://github.com/cormoran/zmk-feature-fast-keymap
CONFIG_ZMK_FAST_KEYMAP=y
CONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=y
CONFIG_ZMK_FAST_KEYMAP_DEFAULT_LAYER=y
# https://github.com/cormoran/zmk-feature-studio-rpc-perf
# RPC の往復遅延・スループット・パケットロスを実測する診断用。
# 分割リレー(SPLIT_RPC_RELAY)は入れていない。測りたいのは設定ツールが
# 話している中央側の経路なので、周辺側まで測る必要がない。
# 測定したいときだけ有効にする。常時入れると RAM を 4KB 使うので、
# 全利用者に負担させる理由が無い。west.yml には残してあるので、
# 下の2行を戻すだけで使える。
# CONFIG_ZMK_STUDIO_RPC_PERF=y
# CONFIG_ZMK_STUDIO_RPC_PERF_HANDLER=y
# https://github.com/cormoran/zmk-feature-watchdog
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y
# https://github.com/cormoran/zmk-feature-device-info
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
# https://github.com/cormoran/zmk-module-battery-history
# TODO: Re-enable after resolving slow save issue
# CONFIG_ZMK_BATTERY_HISTORY=y
# CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=y

#
# Adjustment for Custom RPC Protocol & Split Relay support
#

# Shorten time until persisting setting to prevent data loss after edit setting.
# WARNING: The downside is that it may cause more frequent writes to flash which may reduce flash lifespan.
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
# Increase stack size to prevent stack overflow for split relay feature
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768
# Increase stack size for low priority thread to prevent stack overflow when encoding large notification body for custom rpc.
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
# Increase RPC buffers for zmk-feature-custom-settings and runtime macro payloads.
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000

CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
# ----------------------------------------
# Layout shift (kot149/zmk-layout-shift)
# OS 側が JIS 設定のときの記号ずれを &tog_ls で実行時に補正する。
# 起動時は OFF なので、切り替えない限り従来と同じ。
CONFIG_LAYOUT_SHIFT_TARGET_JIS=y
